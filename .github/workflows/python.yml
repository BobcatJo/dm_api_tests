name: Python Tests

on: [ push,pull_request ]

jobs:
  test:
    name: Python_tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --ugrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest ./tests

