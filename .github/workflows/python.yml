name: Python Tests

on: [ push,pull_request ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    name: Python_tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Set JAVA_HOME
        run: echo "JAVA_HOME=$(dirname $(dirname $(readlink -f $(which java))))" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Deep debug swagger coverage
        run: |
          echo "=== 1. Check Java version ==="
          java -version
          
          echo "=== 2. Check JAR files ==="
          JAR_DIR="/opt/hostedtoolcache/Python/3.11.14/x64/lib/python3.11/site-packages/swagger_coverage_py/swagger-coverage-commandline/lib"
          ls -la "$JAR_DIR" || echo "❌ JAR directory not found!"
          
          echo "=== 3. Count JAR files ==="
          find "$JAR_DIR" -name "*.jar" | wc -l
          
          echo "=== 4. Test Java command with verbose output ==="
          # Пробуем запустить ту же команду и захватываем ВСЕ выводы
          java -cp "$JAR_DIR"/* com.github.viclovsky.swagger.coverage.CommandLine \
            -s swagger-doc-dm-api-account.json \
            -i swagger-coverage-output/185_185_143_231_5051 \
            -c swagger-coverage-config-dm-api-account.json 2>&1 || echo "❌ Java command failed with status $?"
          
          echo "=== 5. Check if main class exists ==="
          # Проверяем, есть ли нужный класс в JAR файлах
          for jar in "$JAR_DIR"/*.jar; do
            echo "Checking $jar"
            jar tf "$jar" | grep -i "com.github.viclovsky.swagger.coverage.CommandLine" && echo "✅ Class found in $jar" || echo "❌ Class not found in $jar"
          done
            
      - name: Run tests
        run: |
          export PATH=$JAVA_HOME/bin:$PATH
          java --version
          which java
          python -m pytest ./tests --alluredir=allure-results --disable-warnings
        continue-on-error: true

      - name: Run Coverage
        if: ${{ always()}}
        run: | 
          python -m packages.notifier.bot

      - name: Archive allure results
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          retention-days: 1

  generate-report:
    runs-on: ubuntu-latest
    needs: test
    name: Generate report
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: sudo wget https://github.com/allure-framework/allure2/releases/download/2.37.0/allure-2.37.0.tgz && sudo tar -xvzf allure-2.37.0.tgz -C /opt/ && sudo ln -s /opt/allure-2.37.0/bin/allure /usr/bin/allure
      - name: Download allure results
        uses: actions/download-artifact@v4
      - run: allure generate -c allure-results -o _site
      - name: Store report
        uses: actions/upload-artifact@v4
        with:
          name: _site
          path: _site
          retention-days: 1

  publish-report:
    runs-on: ubuntu-latest
    needs: generate-report
    name: Publish report
    steps:
    - uses: actions/checkout@v4
    - name: Download site report
      uses: actions/download-artifact@v4
    - name: Upload pages artifact
      uses: actions/upload-pages-artifact@v3
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
    - run: echo "https://bobcatjo.github.io/dm_api_tests/"
